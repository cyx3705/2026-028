<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>极简 IM · 微信剪贴板桥</title>
<style>
  :root{
    --bg:#12141a; --panel:#1a1d26; --line:#272b36; --text:#e6e8ee;
    --dim:#8b93a7; --accent:#4c8dff; --ok:#3ddc84; --bad:#ff5c5c; --warn:#ffb454;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    padding:9px 14px; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; gap:10px; flex:none;
  }
  header h1{font-size:14px;margin:0;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none;transition:background .2s}
  .dot.on{background:var(--ok)} .dot.wait{background:var(--warn)}
  #status{font-size:12px;color:var(--dim)}
  .spacer{margin-left:auto}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
  .tag.ok{color:var(--ok);border-color:#1e4a33}
  .tag.bad{color:var(--bad);border-color:#4a2020}

  #target{
    background:#0e1015; border-bottom:1px solid var(--line); padding:7px 14px;
    font-size:12px; color:var(--dim); flex:none;
  }
  #target b{color:var(--warn)}

  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-direction:column;max-width:76%}
  .row.out{align-self:flex-end;align-items:flex-end}
  .bubble{
    padding:8px 12px;border-radius:12px;background:var(--panel);
    border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;
  }
  .row.out .bubble{background:#1d3a6b;border-color:#2a4d8a}
  .row.clip .bubble{background:#1d2b1f;border-color:#2a4a33}
  .meta{font-size:11px;color:var(--dim);margin:2px 4px}
  .sys{align-self:center;font-size:12px;color:var(--dim);
       background:#0e1015;border:1px solid var(--line);border-radius:20px;padding:4px 12px}
  .sys.bad{color:var(--bad);border-color:#4a2020}
  .empty{margin:auto;color:var(--dim);font-size:13px;text-align:center;line-height:2}

  footer{
    border-top:1px solid var(--line);background:var(--panel);padding:10px 14px;
    display:flex;gap:8px;align-items:flex-end;flex:none;
  }
  textarea{
    flex:1;resize:none;height:42px;max-height:140px;background:#0e1015;color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;outline:none;
  }
  textarea:focus{border-color:var(--accent)}
  textarea:disabled{opacity:.5}
  button{
    background:var(--accent);color:#fff;border:0;border-radius:8px;
    padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;flex:none;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);
               font-weight:400;padding:11px 14px}
</style>
</head>
<body>

<header>
  <span id="dot" class="dot wait"></span>
  <h1>极简 IM</h1>
  <span id="status">连接中…</span>
  <span class="spacer"></span>
  <span class="tag" id="tagWeChat">微信 ?</span>
  <span class="tag" id="tagFg">前台 ?</span>
</header>

<div id="target">
  发送目标 = <b>微信中当前打开的对话</b>（请在微信里先切到「文件传输助手」）
  &nbsp;·&nbsp; 接收 = 在微信里 <b>Ctrl+C</b> 复制消息，这里会自动解密显示
</div>

<div id="log">
  <div class="empty">阶段 1：明文通路验证<br>在下面打字 → 点发送 → 看微信里有没有出现</div>
</div>

<footer>
  <textarea id="input" placeholder="输入内容，Enter 发送（Shift+Enter 换行）" disabled></textarea>
  <button id="send" disabled>发送</button>
  <button id="clear" class="ghost">清空</button>
</footer>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var logEl = $("log"), inputEl = $("input"), sendBtn = $("send"),
      dotEl = $("dot"), statusEl = $("status");

  var WS_URL = (location.protocol === "http:" || location.protocol === "https:")
    ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"
    : "ws://127.0.0.1:8765/ws";

  function setStatus(t, c) { statusEl.textContent = t; dotEl.className = "dot" + (c ? " " + c : ""); }

  function bubble(text, cls, who) {
    var e = logEl.querySelector(".empty");
    if (e) e.remove();
    var row = document.createElement("div");
    row.className = "row" + (cls ? " " + cls : "");
    var b = document.createElement("div");
    b.className = "bubble"; b.textContent = text;
    var m = document.createElement("div");
    m.className = "meta";
    m.textContent = who + " · " + new Date().toLocaleTimeString();
    row.appendChild(b); row.appendChild(m);
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function sys(text, bad) {
    var d = document.createElement("div");
    d.className = "sys" + (bad ? " bad" : "");
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  var ws = null, tries = 0;

  function connect() {
    setStatus("连接中…", "wait");
    try { ws = new WebSocket(WS_URL); }
    catch (e) { setStatus("连接失败: " + e.message, ""); return; }
    var settled = false;

    ws.onopen = function () {
      settled = true; tries = 0;
      setStatus("已连接", "on");
      sendBtn.disabled = false;
      inputEl.disabled = false;
      sys("已连接桥 " + WS_URL);
      refreshStatus();
    };

    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.type === "hello") {
        sys("后端: " + msg.backend);
      } else if (msg.type === "status") {
        var okWe = msg.wechat === "ready";
        $("tagWeChat").textContent = "微信 " + (okWe ? "已就绪" : "未找到");
        $("tagWeChat").className = "tag " + (okWe ? "ok" : "bad");
      } else if (msg.type === "sent") {
        if (msg.ok) { sys("✓ 已粘进微信"); }
        else { sys("✗ 发送失败: " + msg.detail, true); }
      } else if (msg.type === "clipboard") {
        bubble(msg.text, "clip", "剪贴板");
      }
    };

    ws.onerror = function () { if (!settled) setStatus("连接错误", ""); };

    ws.onclose = function () {
      sendBtn.disabled = true; inputEl.disabled = true;
      if (!settled) { setStatus("连接被关闭", ""); return; }
      setStatus("已断开，重连中…", "wait");
      setTimeout(connect, Math.min(500 * Math.pow(2, tries++), 8000));
    };
  }

  // 轮询 /status，好让顶栏的「前台」指示灯动起来
  function refreshStatus() {
    fetch("/status").then(function (r) { return r.json(); }).then(function (s) {
      var fg = s.foreground === true;
      $("tagFg").textContent = "前台 " + (fg ? "微信" : "不是微信");
      $("tagFg").className = "tag " + (fg ? "ok" : "bad");
      if (s.wechat !== true) {
        $("tagWeChat").textContent = "微信 未找到";
        $("tagWeChat").className = "tag bad";
      }
    }).catch(function () { });
  }
  setInterval(refreshStatus, 1500);

  function send() {
    var text = inputEl.value;
    if (!text) { return; }
    if (!ws || ws.readyState !== WebSocket.OPEN) { sys("未连接", true); return; }
    bubble(text, "out", "我");
    ws.send(JSON.stringify({ type: "send", text: text }));
    inputEl.value = "";
    autosize();
  }

  function autosize() {
    inputEl.style.height = "42px";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("input", autosize);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $("clear").addEventListener("click", function () {
    logEl.innerHTML = "";
  });

  connect();
})();
</script>
</body>
</html>
