<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>极简 IM · 桥接测试</title>
<style>
  :root{
    --bg:#12141a; --panel:#1a1d26; --line:#272b36; --text:#e6e8ee;
    --dim:#8b93a7; --accent:#4c8dff; --ok:#3ddc84; --bad:#ff5c5c; --warn:#ffb454;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- 顶栏 ---------- */
  header{
    padding:9px 14px; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; gap:10px; flex:none;
  }
  header h1{font-size:14px;margin:0;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none;transition:background .2s}
  .dot.on{background:var(--ok)} .dot.wait{background:var(--warn)}
  #status{font-size:12px;color:var(--dim)}
  header .spacer{margin-left:auto}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 9px}

  /* ---------- 诊断 ---------- */
  #diag{
    background:#0e1015;border-bottom:1px solid var(--line);
    padding:6px 14px;font:11px/1.6 ui-monospace,Consolas,monospace;color:var(--dim);flex:none;
  }
  #diag b{color:var(--text);font-weight:500}
  #diag .ok{color:var(--ok)} #diag .bad{color:var(--bad)} #diag .warn{color:var(--warn)}

  /* ---------- 主体 ---------- */
  main{flex:1;display:flex;min-height:0}

  /* 左：会话列表 */
  aside{
    width:232px;flex:none;border-right:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;min-height:0;
  }
  .aside-head{padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
  .aside-head input{
    width:100%;background:#0e1015;border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:6px 9px;font:inherit;font-size:12px;outline:none;
  }
  .aside-head input:focus{border-color:var(--accent)}
  #convoList{flex:1;overflow-y:auto;padding:6px}

  .convo{
    padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;
    display:flex;align-items:center;gap:8px;user-select:none;
  }
  .convo:hover{background:#222634}
  .convo.active{background:#1d3a6b}
  .convo .cn{flex:1;min-width:0}
  .convo .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .convo .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .convo.active .sub{color:#b9cdf0}
  .badge{
    background:var(--bad);color:#fff;font-size:10px;border-radius:10px;
    padding:1px 6px;flex:none;font-weight:600;
  }
  .pin{font-size:10px;color:var(--warn);flex:none}

  /* 右：聊天区 */
  section{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  #chatTitle{
    padding:9px 16px;border-bottom:1px solid var(--line);flex:none;
    display:flex;align-items:baseline;gap:9px;
  }
  #chatTitle .t{font-weight:600}
  #chatTitle .id{font-size:11px;color:var(--dim);font-family:ui-monospace,Consolas,monospace}

  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-direction:column;max-width:76%}
  .row.out{align-self:flex-end;align-items:flex-end}
  .bubble{
    padding:8px 12px;border-radius:12px;background:var(--panel);
    border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;
  }
  .row.out .bubble{background:#1d3a6b;border-color:#2a4d8a}
  .meta{font-size:11px;color:var(--dim);margin:2px 4px}
  .sys{align-self:center;font-size:12px;color:var(--dim);
       background:#0e1015;border:1px solid var(--line);border-radius:20px;padding:4px 12px}
  .empty{margin:auto;color:var(--dim);font-size:13px;text-align:center;line-height:2}

  /* 输入区 */
  footer{
    border-top:1px solid var(--line);background:var(--panel);padding:10px 14px;
    display:flex;gap:8px;align-items:flex-end;flex:none;
  }
  textarea{
    flex:1;resize:none;height:42px;max-height:140px;background:#0e1015;color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;outline:none;
  }
  textarea:focus{border-color:var(--accent)}
  textarea:disabled{opacity:.5}
  button{
    background:var(--accent);color:#fff;border:0;border-radius:8px;
    padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;flex:none;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);
               font-weight:400;padding:11px 14px}
</style>
</head>
<body>

<header>
  <span id="dot" class="dot wait"></span>
  <h1>极简 IM</h1>
  <span id="status">连接中…</span>
  <span class="spacer"></span>
  <span class="tag" id="backendTag">后端 -</span>
</header>

<div id="diag">
  <div>protocol=<b id="d-proto">-</b> &nbsp; origin=<b id="d-origin">-</b> &nbsp; isSecureContext=<b id="d-sec">-</b>
       &nbsp; wsUrl=<b id="d-ws">-</b></div>
  <div>结果=<b id="d-result" class="warn">测试中…</b></div>
</div>

<main>
  <aside>
    <div class="aside-head">
      <input id="filter" placeholder="搜索会话…" spellcheck="false">
    </div>
    <div id="convoList"></div>
  </aside>

  <section>
    <div id="chatTitle">
      <span class="t" id="ctName">未选择会话</span>
      <span class="id" id="ctId"></span>
    </div>
    <div id="log">
      <div class="empty">从左边选一个会话开始<br>「文件传输助手」= 发给自己，最安全</div>
    </div>
    <footer>
      <textarea id="input" placeholder="输入内容，Enter 发送（Shift+Enter 换行）" disabled></textarea>
      <button id="send" disabled>发送</button>
      <button id="clear" class="ghost">清空</button>
    </footer>
  </section>
</main>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var logEl = $("log"), inputEl = $("input"), sendBtn = $("send"),
      dotEl = $("dot"), statusEl = $("status"), listEl = $("convoList"),
      filterEl = $("filter");

  // ---- 诊断 -----------------------------------------------------------
  $("d-proto").textContent  = location.protocol;
  $("d-origin").textContent = location.origin === "null" ? "null (opaque)" : location.origin;
  $("d-sec").textContent    = String(window.isSecureContext);

  var WS_URL = (location.protocol === "http:" || location.protocol === "https:")
    ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"
    : "ws://127.0.0.1:8765/ws";
  $("d-ws").textContent = WS_URL;

  function setResult(t, c) { var e = $("d-result"); e.textContent = t; e.className = c || ""; }
  function setStatus(t, c) { statusEl.textContent = t; dotEl.className = "dot" + (c ? " " + c : ""); }

  // ---- 状态 -----------------------------------------------------------
  var convos = [];        // [{id,name,kind,note,builtin}]
  var activeId = null;    // 当前选中的会话 id
  var store = {};         // id -> [{dir,text,who,ts}]
  var unread = {};        // id -> 未读数

  function findConvo(id) {
    for (var i = 0; i < convos.length; i++) { if (convos[i].id === id) { return convos[i]; } }
    return null;
  }

  function sys(text) {
    var d = document.createElement("div");
    d.className = "sys";
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ---- 会话列表 -------------------------------------------------------
  function renderConvos() {
    var kw = filterEl.value.trim().toLowerCase();
    listEl.innerHTML = "";

    convos.forEach(function (c) {
      if (kw && c.name.toLowerCase().indexOf(kw) < 0 && c.id.toLowerCase().indexOf(kw) < 0) { return; }

      var row = document.createElement("div");
      row.className = "convo" + (c.id === activeId ? " active" : "");
      row.title = c.id;

      var cn = document.createElement("div");
      cn.className = "cn";
      var nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = c.name;
      var sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = c.note || ((c.kind === "group" ? "群聊" : "联系人") + " · " + c.id);
      cn.appendChild(nm); cn.appendChild(sub);
      row.appendChild(cn);

      if (c.builtin) {
        var pin = document.createElement("span");
        pin.className = "pin"; pin.textContent = "内置";
        row.appendChild(pin);
      }
      if (unread[c.id]) {
        var b = document.createElement("span");
        b.className = "badge"; b.textContent = unread[c.id] > 99 ? "99+" : unread[c.id];
        row.appendChild(b);
      }

      row.addEventListener("click", function () { selectConvo(c.id); });
      listEl.appendChild(row);
    });

    if (!listEl.children.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.style.fontSize = "12px";
      e.textContent = convos.length ? "没有匹配的会话" : "会话列表为空";
      listEl.appendChild(e);
    }
  }

  function selectConvo(id) {
    activeId = id;
    unread[id] = 0;

    var c = findConvo(id);
    $("ctName").textContent = c ? c.name : id;
    $("ctId").textContent   = id;

    inputEl.disabled = false;
    inputEl.focus();
    updateSendBtn();

    renderConvos();
    renderLog();
  }

  // ---- 消息渲染 -------------------------------------------------------
  function renderLog() {
    logEl.innerHTML = "";
    var items = store[activeId] || [];

    if (!items.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = "还没有消息<br>在下面输入点「发送」试试";
      logEl.appendChild(e);
      return;
    }

    items.forEach(function (m) {
      var row = document.createElement("div");
      row.className = "row" + (m.dir === "out" ? " out" : "");
      var b = document.createElement("div");
      b.className = "bubble";
      b.textContent = m.text;
      var meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = m.who + " · " + new Date(m.ts * 1000).toLocaleTimeString();
      row.appendChild(b); row.appendChild(meta);
      logEl.appendChild(row);
    });

    logEl.scrollTop = logEl.scrollHeight;
  }

  function addMsg(id, dir, text, who) {
    if (!store[id]) { store[id] = []; }
    store[id].push({ dir: dir, text: text, who: who, ts: Date.now() / 1000 });

    if (id === activeId) {
      renderLog();
    } else {
      unread[id] = (unread[id] || 0) + 1;
      renderConvos();
    }
  }

  // ---- WebSocket ------------------------------------------------------
  var ws = null, tries = 0;

  function connect() {
    setStatus("连接中…", "wait");
    try { ws = new WebSocket(WS_URL); }
    catch (e) { onFail("构造失败: " + e.message); return; }

    var settled = false;

    ws.onopen = function () {
      settled = true; tries = 0;
      setStatus("已连接", "on");
      setResult("成功 — WebSocket 连通", "ok");
      updateSendBtn();
    };

    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.type === "hello") {
        // 只更新顶栏标签。不往消息区写 sys —— 会话列表一到就会 renderLog() 把它清掉。
        $("backendTag").textContent = "后端 " + msg.backend;
      } else if (msg.type === "convos") {
        convos = msg.list || [];
        renderConvos();
        if (!activeId && convos.length) { selectConvo(convos[0].id); }
      } else if (msg.type === "sent") {
        addMsg(msg.to, "out", msg.text, "我");
      } else if (msg.type === "message") {
        addMsg(msg.from, "in", msg.text, msg.fromName || msg.from);
      }
    };

    ws.onerror = function () {
      if (!settled) { onFail("WebSocket error（多半被拦了，看 DevTools Console）"); }
    };

    ws.onclose = function (ev) {
      updateSendBtn();
      if (!settled) { onFail("连接被关闭，code=" + ev.code); return; }
      setStatus("已断开，重连中…", "wait");
      setTimeout(connect, Math.min(500 * Math.pow(2, tries++), 8000));
    };
  }

  function onFail(why) {
    setStatus("连接失败", "");
    setResult("失败 — " + why, "bad");
    sys("✗ " + why);
  }

  function updateSendBtn() {
    sendBtn.disabled = !(ws && ws.readyState === WebSocket.OPEN && activeId);
  }

  // ---- 交互 -----------------------------------------------------------
  function send() {
    if (!activeId) { sys("先选一个会话"); return; }
    var text = inputEl.value;
    if (!text.trim()) { return; }
    if (!ws || ws.readyState !== WebSocket.OPEN) { sys("未连接，发不出去"); return; }

    ws.send(JSON.stringify({ type: "send", to: activeId, text: text }));
    inputEl.value = "";
    autosize();
  }

  function autosize() {
    inputEl.style.height = "42px";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("input", autosize);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  filterEl.addEventListener("input", renderConvos);
  $("clear").addEventListener("click", function () {
    if (activeId) { store[activeId] = []; renderLog(); }
  });

  connect();

  // spike 用：把诊断结果回传到桥的日志（图片信标，不受 CORS 限制）
  setTimeout(function () {
    var url = "http://127.0.0.1:8765/report"
            + "?p=" + encodeURIComponent(location.protocol)
            + "&w=" + encodeURIComponent(WS_URL)
            + "&r=" + encodeURIComponent($("d-result").textContent)
            + "&t=" + Date.now();
    new Image().src = url;
  }, 2500);
})();
</script>
</body>
</html>
